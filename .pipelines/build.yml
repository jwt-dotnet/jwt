trigger:
  branches:
    include:
    - main
  paths:
    exclude:
    - '**/*.md'

strategy:
  matrix:
    windows:
      imageName: windows-latest
    linux:
      imageName: ubuntu-latest
    macos:
      imageName: macos-latest

pool:
  vmImage: $(imageName)

parameters:
- name: solutionName
  type: string
  default: 'JWT.sln'
- name: buildConfiguration
  type: string
  default: 'Release'
- name: buildPlatform
  type: string
  default: 'Any CPU'
- name: targetFrameworks
  type: object
  default:
  - '6.x'
  - '8.x'
  - '10.x'
- name: windowsTargetFrameworks
  type: object
  default:
  - '3.1.x'

steps:
- checkout: self
  submodules: true

- ${{ each targetFramework in parameters.windowsTargetFrameworks }}:
  - task: UseDotNet@2
    displayName: ${{ format('Install .NET {0}', targetFramework) }}
    condition: eq(variables['Agent.OS'], 'Windows_NT')
    inputs:
      packageType: sdk
      version: ${{ targetFramework }}
      installationPath: '$(Agent.ToolsDirectory)/dotnet'

- ${{ each targetFramework in parameters.targetFrameworks }}:
  - task: UseDotNet@2
    displayName: ${{ format('Install .NET {0}', targetFramework) }}
    inputs:
      packageType: sdk
      version: ${{ targetFramework }}
      installationPath: '$(Agent.ToolsDirectory)/dotnet'

- task: NuGetToolInstaller@1
  displayName: 'Install NuGet'
  condition: eq(variables['Agent.OS'], 'Windows_NT')

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages for .NET Core'
  inputs:
    command: restore
    projects: ${{ parameters.solutionName }}

- task: NuGetCommand@2
  displayName: 'Restore NuGet packages for .NET Framework'
  condition: eq(variables['Agent.OS'], 'Windows_NT')
  inputs:
    command: restore
    restoreSolution: ${{ parameters.solutionName }}

- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: build
    projects: ${{ parameters.solutionName }}
    arguments: '-c ${{ parameters.buildConfiguration }} --no-restore -p:ContinuousIntegrationBuild=true'

- task: DotNetCoreCLI@2
  displayName: 'Run tests'
  condition: eq(variables['Agent.OS'], 'Windows_NT')
  inputs:
    command: test
    projects: 'tests/**/*.csproj'
    arguments: ' -c ${{ parameters.buildConfiguration }} --no-build --no-restore'
    testRunner: VSTest
    testResultsFormat: VSTest
    testResultsFiles: '**/*.trx'
    failTaskOnFailedTests: true

- task: DotNetCoreCLI@2
  displayName: 'Run tests for net6.0'
  condition: ne(variables['Agent.OS'], 'Windows_NT')
  inputs:
    command: test
    projects: |
      tests/JWT.Tests.Net60/*.csproj
      tests/JWT.Extensions.*.Tests/*.csproj
    arguments: '-c ${{ parameters.buildConfiguration }} --no-build --no-restore -f net6.0'
    testRunner: VSTest
    testResultsFormat: VSTest
    testResultsFiles: '**/*.trx'
    failTaskOnFailedTests: true

- task: DotNetCoreCLI@2
  displayName: 'Run tests for net8.0'
  condition: ne(variables['Agent.OS'], 'Windows_NT')
  inputs:
    command: test
    projects: |
      tests/JWT.Tests.Net80/*.csproj
      tests/JWT.Extensions.*.Tests/*.csproj
    arguments: '-c ${{ parameters.buildConfiguration }} --no-build --no-restore -f net8.0'
    testRunner: VSTest
    testResultsFormat: VSTest
    testResultsFiles: '**/*.trx'
    failTaskOnFailedTests: true

- task: DotNetCoreCLI@2
  displayName: 'Run tests for net10.0'
  condition: ne(variables['Agent.OS'], 'Windows_NT')
  inputs:
    command: test
    projects: |
      tests/JWT.Tests.Net100/*.csproj
      tests/JWT.Extensions.*.Tests/*.csproj
    arguments: '-c ${{ parameters.buildConfiguration }} --no-build --no-restore -f net10.0'
    testRunner: VSTest
    testResultsFormat: VSTest
    testResultsFiles: '**/*.trx'
    failTaskOnFailedTests: true

- task: DotNetCoreCLI@2
  displayName: 'Create NuGet packages'
  condition: eq(variables['Agent.OS'], 'Windows_NT')
  inputs:
    command: pack
    packagesToPack: 'src/**/*.csproj'
    configuration: ${{ parameters.buildConfiguration }}
    nobuild: true

- task: CopyFiles@2
  displayName: 'Copy changelog'
  condition: eq(variables['Agent.OS'], 'Windows_NT')
  inputs:
    sourceFolder: $(Build.SourcesDirectory)
    targetFolder: $(Build.ArtifactStagingDirectory)
    contents: |
      CHANGELOG.md

- task: PublishBuildArtifacts@1
  displayName: 'Publish build artifacts'
  condition: eq(variables['Agent.OS'], 'Windows_NT')
